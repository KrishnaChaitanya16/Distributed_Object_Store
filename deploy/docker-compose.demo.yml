# Adds the demo controls to the web UI: stop and start workers and damage chunks. Mounts the Docker socket, so use it only on a machine you trust.
# docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.demo.yml up -d --build
services:
  controller:
    environment:
      DEMO_MODE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
